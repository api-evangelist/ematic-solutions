x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 17
  pass: local-v1
  note: >-
    Prior rounds recorded this company as "a services and consulting company rather than an API
    producer" with no developer portal. That was wrong. STEP 0b contract discovery found a public
    developer knowledge base at kb.ematicsolutions.com (HTTP 200) carrying a full RESTful Core API
    reference (7 operations, request bodies, status codes, four-language code samples), a developer
    guide, the Ematic.js browser tracker and six e-commerce plugin integrations. Ematic publishes NO
    machine-readable contract — /openapi.json, /openapi.yaml, /swagger.json, /api-docs and /redoc all
    404 on the api, kb and www hosts — so no openapi/ artifact was written and none was fabricated.
    Every artifact in this repo is read from Ematic's own published documentation or probed live.
