apis:
- aid: ematic-solutions-core-api
  name: Ematic Solutions Core API
  description: >-
    The Ematic Solutions Core API is a RESTful, JSON-only web service (labelled "beta" by Ematic) that
    lets an e-commerce site record product events — browse, cart, checkout and conversion — plus batch
    event loads, and add or remove email addresses from a connected ESP list. It is the
    technology-independent server-side counterpart to the Ematic.js browser tracker and exists mainly
    to integrate Retry-iQ with e-commerce platforms. Client accounts are sharded across data centers,
    so the host is derived from the suffix of the account's Ematic API key.
  humanURL: https://kb.ematicsolutions.com/restful-api/core-api.html
  baseURL: https://{dc}-api.ematicsolutions.com:8084/v2
